theme = "constellation"
baseURL = "https://issledova.tel/"
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 2
buildDrafts = false
buildFuture = false
enableEmoji = true

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[security]
  allowContent = ['^text/html$', '^text/markdown$']
