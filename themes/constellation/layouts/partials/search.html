<dialog class="search-dialog" aria-labelledby="search-title">
  <div class="search-panel">
    <div class="search-heading">
      <h2 id="search-title">Search</h2>
      <button class="search-close" type="button">Close</button>
    </div>
    <label class="sr-only" for="site-search">Search articles</label>
    <input id="site-search" type="search" placeholder="Keywords" autocomplete="off">
    <p class="search-hint">Type to search titles, summaries, and article text.</p>
    <ol class="search-results" aria-live="polite"></ol>
  </div>
</dialog>
